<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --border: #2a2a2a;
  --text: #e5e5e5;
  --muted: #888;
  --accent: #6366f1;
  --user-bg: #1e1e2e;
  --ai-bg: #141414;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

/* ── Auth screen ── */
#authScreen {
  display: flex; align-items: center; justify-content: center; flex: 1;
}
.auth-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 40px; width: 420px; max-width: 95vw;
}
.auth-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
.auth-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
.auth-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.auth-card input {
  width: 100%; background: #222; border: 1px solid var(--border); color: var(--text);
  padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
}
.auth-card input:focus { outline: none; border-color: var(--accent); }
.auth-card select {
  width: 100%; background: #222; border: 1px solid var(--border); color: var(--text);
  padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 24px; appearance: none;
}
.btn-auth {
  width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn-auth:hover { background: #5254cc; }
.auth-error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

/* ── Chat layout ── */
#chatScreen { display: none; flex-direction: column; height: 100vh; }

.chat-header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.chat-header-left { display: flex; align-items: center; gap: 12px; }
.model-badge {
  background: #1e1e2e; border: 1px solid #3b3b6b; color: #a5b4fc;
  padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
}
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
}
.icon-btn:hover { background: var(--border); color: var(--text); }

.messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 2px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.msg { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; max-width: 860px; width: 100%; }
.msg.user { background: var(--user-bg); align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { background: var(--ai-bg); align-self: flex-start; }
.msg.system-msg { align-self: center; background: transparent; }

.avatar {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 600;
}
.avatar.user { background: var(--accent); color: #fff; }
.avatar.assistant { background: #1a1a2e; border: 1px solid #3b3b6b; color: #a5b4fc; }

.msg-content { flex: 1; font-size: 14px; line-height: 1.65; min-width: 0; }
.msg.user .msg-content { text-align: right; }

/* Markdown-ish styling */
.msg-content pre {
  background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 14px; margin: 10px 0; overflow-x: auto; font-size: 13px;
}
.msg-content code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
.msg-content p { margin-bottom: 8px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content ul, .msg-content ol { padding-left: 20px; margin-bottom: 8px; }
.msg-content li { margin-bottom: 4px; }
.msg-content h1,.msg-content h2,.msg-content h3 { margin: 12px 0 6px; }
.msg-content blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 8px 0; }
.msg-content strong { color: #fff; }
.msg-content a { color: #60a5fa; }

.thinking-block {
  background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
  padding: 10px 14px; margin-bottom: 10px; font-size: 13px; color: #666;
  font-style: italic;
}
.thinking-label { font-size: 11px; color: #444; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

.cursor { display: inline-block; width: 8px; height: 14px; background: var(--accent); border-radius: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }

.typing-indicator { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.dots span { display: inline-block; width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: dot 1.4s ease infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }

/* ── Input area ── */
.input-area {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 16px 20px; flex-shrink: 0;
}
.input-box {
  display: flex; gap: 10px; align-items: flex-end;
  background: #222; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
  transition: border-color 0.2s;
}
.input-box:focus-within { border-color: var(--accent); }
#msgInput {
  flex: 1; background: transparent; border: none; color: var(--text);
  font-size: 14px; line-height: 1.5; resize: none; max-height: 160px; min-height: 22px;
  font-family: inherit;
}
#msgInput:focus { outline: none; }
#msgInput::placeholder { color: #555; }
.send-btn {
  background: var(--accent); border: none; color: #fff; border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.2s;
}
.send-btn:hover { background: #5254cc; }
.send-btn:disabled { background: #333; cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; }
.input-hint { font-size: 11px; color: #444; margin-top: 8px; text-align: center; }

.usage-bar-mini {
  display: flex; gap: 16px; font-size: 11px; color: #555; margin-bottom: 10px;
}
.usage-item span { color: #888; }

/* System message */
.sys-note { font-size: 12px; color: #444; text-align: center; padding: 8px; }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="authScreen">
  <div class="auth-card">
    <h1>Claude Chat</h1>
    <p>Enter your API token to start chatting.</p>
    <label>API Token</label>
    <input type="password" id="tokenInput" placeholder="sk-rr-..." autocomplete="off">
    <label>Model</label>
    <select id="modelSelect">
      <option value="claude-opus-4-5">Claude Opus</option>
      <option value="claude-sonnet-4-5" selected>Claude Sonnet</option>
      <option value="claude-haiku-4-5">Claude Haiku</option>
      <option value="claude-fable-5-1">Claude Fable</option>
    </select>
    <button class="btn-auth" onclick="startChat()">Start Chat</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- Chat Screen -->
<div id="chatScreen">
  <div class="chat-header">
    <div class="chat-header-left">
      <strong style="font-size:15px">Claude Chat</strong>
      <span class="model-badge" id="modelBadge"></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="showStats()">📊 Usage</button>
      <button class="icon-btn" onclick="clearChat()">🗑 Clear</button>
      <button class="icon-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="sys-note">Start a conversation below.</div>
  </div>

  <div class="input-area">
    <div class="usage-bar-mini" id="usageMini"></div>
    <div class="input-box">
      <textarea id="msgInput" placeholder="Message Claude..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>
</div>

<script>
const BASE = window.location.origin;
let token = '';
let model = 'claude-sonnet-4-5';
let messages = [];
let streaming = false;
let totalIn = 0, totalOut = 0;

async function startChat() {
  token = document.getElementById('tokenInput').value.trim();
  model = document.getElementById('modelSelect').value;
  if (!token) { showError('Please enter your token'); return; }

  // Validate token via stats endpoint
  const r = await fetch(`${BASE}/stats?token=${encodeURIComponent(token)}`);
  if (!r.ok || (await r.text()).includes('Invalid token')) {
    showError('Invalid token. Please check and try again.');
    return;
  }

  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('modelBadge').textContent = model;
  localStorage.setItem('rr_token', token);
  localStorage.setItem('rr_model', model);
  updateUsageMini();
}

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}

function logout() {
  localStorage.removeItem('rr_token');
  location.reload();
}

function clearChat() {
  if (!confirm('Clear conversation?')) return;
  messages = [];
  totalIn = 0; totalOut = 0;
  document.getElementById('messages').innerHTML = '<div class="sys-note">Conversation cleared.</div>';
  updateUsageMini();
}

async function showStats() {
  window.open(`${BASE}/stats?token=${encodeURIComponent(token)}`, '_blank');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function appendMessage(role, content, id) {
  const msgs = document.getElementById('messages');
  // Remove welcome note
  const note = msgs.querySelector('.sys-note');
  if (note) note.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.id = id || '';

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'user' ? 'U' : 'C';

  const contentDiv = document.createElement('div');
  contentDiv.className = 'msg-content';
  if (typeof content === 'string') contentDiv.innerHTML = renderMarkdown(content);

  div.appendChild(avatar);
  div.appendChild(contentDiv);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return contentDiv;
}

function renderMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hup]|<li|<blockquote|<pre)(.+)$/gm, '<p>$1</p>')
    .replace(/<p><\/p>/g, '');
}

function updateUsageMini() {
  document.getElementById('usageMini').innerHTML =
    totalIn || totalOut
      ? `<div>Tokens this session: <span>${(totalIn+totalOut).toLocaleString()}</span> (${totalIn.toLocaleString()} in / ${totalOut.toLocaleString()} out)</div>`
      : '';
}

async function sendMessage() {
  if (streaming) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  streaming = true;

  messages.push({ role: 'user', content: text });
  appendMessage('user', text);

  // Show typing indicator
  const typingId = 'typing_' + Date.now();
  const msgs = document.getElementById('messages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg assistant';
  typingDiv.id = typingId;
  typingDiv.innerHTML = `
    <div class="avatar assistant">C</div>
    <div class="msg-content">
      <div class="typing-indicator"><div class="dots"><span></span><span></span><span></span></div></div>
    </div>`;
  msgs.appendChild(typingDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const resp = await fetch(`${BASE}/v1/messages`, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': token,
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model,
        max_tokens: 8192,
        stream: true,
        messages,
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }

    // Replace typing indicator with real message
    typingDiv.remove();
    const contentDiv = appendMessage('assistant', '');
    let fullText = '';
    let cursor = document.createElement('span');
    cursor.className = 'cursor';
    contentDiv.appendChild(cursor);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') continue;
        let data;
        try { data = JSON.parse(payload); } catch (_) { continue; }

        if (data.type === 'content_block_delta' && data.delta?.type === 'text_delta') {
          fullText += data.delta.text;
          contentDiv.innerHTML = renderMarkdown(fullText);
          contentDiv.appendChild(cursor);
          msgs.scrollTop = msgs.scrollHeight;
        }
        if (data.type === 'message_delta' && data.usage) {
          totalOut += data.usage.output_tokens || 0;
        }
        if (data.type === 'message_start' && data.message?.usage) {
          totalIn += data.message.usage.input_tokens || 0;
        }
      }
    }

    cursor.remove();
    contentDiv.innerHTML = renderMarkdown(fullText);
    messages.push({ role: 'assistant', content: fullText });
    updateUsageMini();

  } catch (err) {
    typingDiv.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'sys-note';
    errDiv.style.color = '#f87171';
    errDiv.textContent = '⚠ Error: ' + err.message;
    msgs.appendChild(errDiv);
  }

  streaming = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

// Auto-login if token saved
window.addEventListener('load', () => {
  const saved = localStorage.getItem('rr_token');
  const savedModel = localStorage.getItem('rr_model');
  if (saved) {
    document.getElementById('tokenInput').value = saved;
    if (savedModel) document.getElementById('modelSelect').value = savedModel;
    startChat();
  }
});
</script>
</body>
</html>
